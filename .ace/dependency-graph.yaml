# Grafo de Dependências entre Artefatos LLC
# Cada artefato declara: quais artefatos o originam (depends_on)
# e quais artefatos ele impacta quando modificado (triggers_update).
#
# Padrão: modificar um artefato fonte → revisar todos os triggers_update
# em cascata até os artefatos terminais (sem triggers_update).
#
# Gerado e mantido pelo pipeline LLC. Atualizado a cada execução do Step 4.

version: "1.2.0"
generated_by: "llc-step-4"
last_updated: "2026-06-13"

artifacts:

  # ── ENTRADA (Step 0) ──
  ingestion_raw:
    path_pattern: "docs/business/ingestion/*"
    depends_on: []
    triggers_update:
      - ingestion_converted

  ingestion_converted:
    path_pattern: "docs/business/ingestion/converted/*"
    depends_on:
      - ingestion_raw
    triggers_update:
      - visao_estrategica
      - module_specs

  # ── STEP 0.5 ──
  visao_estrategica:
    path: "docs/business/specs/visao_estrategica_e_negocio.md"
    depends_on:
      - ingestion_converted
    triggers_update:
      - glossario
      - requisitos_funcionais
      - requisitos_nao_funcionais
      - regras_negocio
      - perfis_permissoes
      - catalogo_integracoes
      - prd_executivo
      - prd_tecnico
      - architecture
      - design_system

  module_specs:
    path_pattern: "docs/business/specs/MOD-*.md"
    depends_on:
      - ingestion_converted
      - visao_estrategica
    triggers_update:
      - requisitos_funcionais
      - workflows_bpmn
      - prd_tecnico
      - prps
      - tasks

  # ── STEP 1 ──
  glossario:
    path: "docs/business/specs/glossario.md"
    depends_on:
      - visao_estrategica
      - module_specs
    triggers_update:
      - requisitos_funcionais
      - regras_negocio
      - prd_executivo
      - prd_tecnico

  requisitos_funcionais:
    path: "docs/business/specs/requisitos_funcionais.md"
