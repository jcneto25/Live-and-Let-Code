repos:
  - repo: local
    hooks:
      - id: ace-validate
        name: ACE — Cobertura de sessão + integridade do histórico
        description: Verifica cobertura de sessão (commit com código exige sessão ACE registrada), integridade do index.json, context_seed, tags XML e consistência
        entry: bash .ace/scripts/pre-commit.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
