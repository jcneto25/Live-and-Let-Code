repos:
  - repo: local
    hooks:
      - id: ace-validate
        name: ACE — Validar histórico de sessões
        description: Verifica integridade do index.json, context_seed, tags XML e consistência
        entry: bash .ace/scripts/pre-commit.sh
        language: system
        files: ^\.ace/.*$
        pass_filenames: false
        always_run: false
        stages: [pre-commit]
