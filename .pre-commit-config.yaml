repos:
  - repo: local
    hooks:
      - id: ace-validate
        name: ACE — Cobertura de sessão + integridade do histórico + secret scanning
        description: Verifica cobertura de sessão (commit com código exige sessão ACE registrada), integridade do index.json, context_seed, tags XML, consistência e secrets hardcoded
        entry: bash .ace/scripts/pre-commit.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ace-tests
        name: ACE — Test Gate (placeholders + delays + execução)
        description: "Detecta placeholders (expect(true).toBe(true)), delays hardcoded (setTimeout) em testes, executa test runner nos arquivos modificados. Stack-aware: Jest, Vitest, Pytest, Go test."
        entry: bash .ace/scripts/pre-commit-tests.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ace-llm-validation
        name: ACE — LLM Self-Validation (8 checks pós-geração)
        description: "Verifica código gerado por IA: secrets hardcoded, SQL injection, return null em services, SQL fora de repositories, placeholder tests, delays em testes, any em signatures, console.log. Bloqueia commit se houver ❌ (Ação 8 — Harness Preventivo LLC §2.8)."
        entry: bash .ace/scripts/llm-validation.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
