# Architectural Fitness Functions — GitHub Actions Workflow
#
# Runs the LLC Architectural Fitness Functions in CI before merge.
# Ensures: Dependency Rule, Circular Deps, Interface Coverage, Domain Isolation,
# Use Case Size, Module Coverage — all pass with no violations.
#
# Usage:
#   1. Copy this file to your project's .github/workflows/
#   2. Ensure .ace/scripts/ is available (copy from LLC methodology repo)
#   3. Ensure .ace/arch-config.yaml exists (generated by Step 5a)
#   4. PRs will automatically run fitness functions before merge

name: Architectural Fitness Functions

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

# Concurrency: cancel in-flight runs for same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch-fitness:
    name: Architectural Fitness Functions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write  # For uploading artifacts

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git history analysis

      # ── 2. Setup Python ──────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            .ace/scripts/requirements.txt
            requirements.txt
            pyproject.toml

      # ── 3. Setup Node.js (for TypeScript projects) ───────────────
      - name: Setup Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node/actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            yarn.lock
            pnpm-lock.yaml

      # ── 4. Install Dependencies ──────────────────────────────────
      - name: Install Python dependencies
        run: |
          set -euo pipefail
          # Install LLC scripts dependencies if requirements exist
          if [ -f .ace/scripts/requirements.txt ]; then
            echo "📦 Installing LLC scripts dependencies..."
            pip install -r .ace/scripts/requirements.txt
          fi
          # Install project Python dependencies if any
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install -e . 2>/dev/null || pip install .
          fi

      - name: Install Node.js dependencies
        if: hashFiles('package.json') != ''
        run: |
          set -euo pipefail
          echo "📦 Installing Node.js dependencies..."
          if [ -f pnpm-lock.yaml ]; then
            corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      # ── 5. Run Architectural Fitness Functions ───────────────────
      - name: Run Architectural Fitness Functions
        id: fitness
        run: |
          set -euo pipefail
          echo "🏗️ Running Architectural Fitness Functions..."

          # Ensure scripts are executable
          chmod +x .ace/scripts/fitness-functions.py

          # Run all checks with strict mode (exits 1 on violations)
          python3 .ace/scripts/fitness-functions.py --all --strict --verbose

          echo "✅ All fitness function checks passed!"

      # ── 6. Upload Fitness Report Artifact ────────────────────────
      - name: Upload fitness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch-fitness-report-${{ github.ref_name }}
          path: |
            arch-fitness-report.json
            .ace/arch-fitness-report.json
          retention-days: 30
          compression-level: 6

      # ── 7. Download Previous Report for Trend Comparison ─────────
      - name: Download previous fitness report (PR base branch)
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: arch-fitness-report-${{ github.base_ref }}
          path: .ace/previous/
        continue-on-error: true

      # ── 8. Compare Trends (Optional) ─────────────────────────────
      - name: Compare fitness trends
        if: github.event_name == 'pull_request' && hashFiles('.ace/previous/arch-fitness-report.json') != ''
        run: |
          set -euo pipefail
          echo "📊 Comparing fitness function trends..."
          python3 -c "
import json
try:
    with open('arch-fitness-report.json') as f:
        current = json.load(f)
    with open('.ace/previous/arch-fitness-report.json') as f:
        previous = json.load(f)
    curr_blocked = current.get('summary', {}).get('blocked', False)
    prev_blocked = previous.get('summary', {}).get('blocked', False)
    if curr_blocked and not prev_blocked:
        print('⚠️  NEW BLOCKING VIOLATIONS INTRODUCED!')
        exit(1)
    elif not curr_blocked and prev_blocked:
        print('✅ Previously blocking violations resolved!')
    else:
        print('ℹ️  Blocking status unchanged')
except Exception as e:
    print(f'Could not compare trends: {e}')
"

      # ── 9. Summary Comment on PR ──────────────────────────────────
      - name: Post fitness summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '## 🏗️ Architectural Fitness Functions Results\n\n';

            const reportPaths = [
              'arch-fitness-report.json',
              '.ace/arch-fitness-report.json'
            ];

            let report = null;
            for (const path of reportPaths) {
              if (fs.existsSync(path)) {
                report = JSON.parse(fs.readFileSync(path, 'utf-8'));
                break;
              }
            }

            if (!report) {
              summary += '⚠️ No fitness report generated.\n';
            } else {
              const s = report.summary;
              summary += `| Metric | Value |\n|--------|-------|\n`;
              summary += `| Total Checks | ${s.total} |\n`;
              summary += `| Passed | ${s.passed} |\n`;
              summary += `| Blocked | ${s.blocked ? '❌ YES' : '✅ NO'} |\n`;
              summary += `| Warnings | ${s.warnings} |\n\n`;

              if (s.blocked) {
                summary += '### ❌ Blocking Violations Found\n\n';
                for (const [check, result] of Object.entries(report.results)) {
                  if (result.blocked) {
                    summary += `**${check}**: ${result.message}\n`;
                    if (result.violations && result.violations.length > 0) {
                      summary += '<details><summary>Violations</summary>\n\n';
                      for (const v of result.violations.slice(0, 10)) {
                        summary += `- \`${v.file}:${v.line}\` — ${v.message}\n`;
                      }
                      if (result.violations.length > 10) {
                        summary += `- ... and ${result.violations.length - 10} more\n`;
                      }
                      summary += '\n</details>\n\n';
                    }
                  }
                }
              } else if (s.warnings > 0) {
                summary += '### ⚠️ Warnings (Non-blocking)\n\n';
                for (const [check, result] of Object.entries(report.results)) {
                  if (!result.passed && !result.blocked) {
                    summary += `- **${check}**: ${result.message}\n`;
                  }
                }
              } else {
                summary += '### ✅ All Checks Passed\n\nNo architectural violations detected.\n';
              }

              summary += '\n---\n*Generated by [LLC Architectural Fitness Functions](https://github.com/jcneto25/Live-and-Let-Code)*';
            }

            // Post or update comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Architectural Fitness Functions Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summary,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary,
              });
            }
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Optional: Full Gate (build + test + fitness) ─────────────────
  full-arch-gate:
    name: Full Architectural Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.labels?.some(l => l.name == 'main')
    needs: [arch-fitness]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          set -euo pipefail
          # Python
          if [ -f .ace/scripts/requirements.txt ]; then pip install -r .ace/scripts/requirements.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          # Node
          if [ -f package.json ]; then
            if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile;
            elif [ -f yarn.lock ]; then yarn install --frozen-lockfile;
            else npm ci; fi
          fi

      - name: Build / Type Check
        run: |
          set -euo pipefail
          # TypeScript
          if [ -f tsconfig.json ]; then
            echo "🔧 Running TypeScript type check..."
            npx tsc --noEmit
          fi
          # Python
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            echo "🔧 Running Python compilation check..."
            python -m compileall . -q
          fi

      - name: Run Tests with Coverage
        run: |
          set -euo pipefail
          # TypeScript
          if [ -f package.json ]; then
            echo "🧪 Running TypeScript tests with coverage..."
            if npm run 2>/dev/null | grep -q "test:coverage"; then
              npm run test:coverage
            elif npm run 2>/dev/null | grep -q "^  coverage"; then
              npm run coverage
            elif npm run 2>/dev/null | grep -q "test:ci"; then
              npm run test:ci
            else
              npx vitest run --coverage
            fi
          fi
          # Python
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then
            echo "🧪 Running Python tests with coverage..."
            python -m pytest --cov=. --cov-report=term-missing --cov-report=json:coverage.json
          fi

      - name: Run Code Health + Coverage Gate
        run: |
          set -euo pipefail
          chmod +x .ace/scripts/pre-wave-check.sh
          chmod +x .ace/scripts/code-health.py

          COVERAGE_FILE=""
          if [ -f coverage/coverage-final.json ]; then
            COVERAGE_FILE="coverage/coverage-final.json"
          elif [ -f coverage.json ]; then
            COVERAGE_FILE="coverage.json"
          elif [ -f coverage.out ]; then
            COVERAGE_FILE="coverage.out"
          elif [ -f lcov.info ]; then
            COVERAGE_FILE="lcov.info"
          fi

          if [ -n "$COVERAGE_FILE" ]; then
            .ace/scripts/pre-wave-check.sh \
              --coverage-only \
              --coverage-threshold "${COVERAGE_THRESHOLD:-80}" \
              --fail-on-zero

            python3 .ace/scripts/code-health.py \
              --since "90 days ago" \
              --coverage-file "$COVERAGE_FILE" \
              --coverage-history ".ace/coverage-history.json" \
              --coverage-threshold-statements "${COVERAGE_THRESHOLD_STATEMENTS:-80}" \
              --coverage-threshold-branches "${COVERAGE_THRESHOLD_BRANCHES:-70}" \
              --coverage-threshold-functions "${COVERAGE_THRESHOLD_FUNCTIONS:-80}" \
              --coverage-threshold-lines "${COVERAGE_THRESHOLD_LINES:-80}" \
              --coverage-regression-threshold "${COVERAGE_REGRESSION_THRESHOLD:-5.0}" \
              --strict
          else
            echo "⚠️ No coverage file found, skipping coverage gate"
          fi

      - name: Upload coverage history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-history-${{ github.ref_name }}
          path: .ace/coverage-history.json
          retention-days: 90
