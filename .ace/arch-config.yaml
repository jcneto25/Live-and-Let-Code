# Configuração de Fitness Functions para verificação arquitetural automatizada.
# Gerado por: llc-step-5 (Arquitetura)
# Documentação: docs/skills/llc-arch-fitness.md
#
# Modos de enforcement:
#   block  → Bloqueia merge (exige correção)
#   warn   → Apenas alerta (registra em dívida técnica)
#   hybrid → block para core_modules, warn para demais

version: "1.0"

# Módulos que seguem regras mais rígidas (block em vez de warn)
core_modules:
  - auth
  - usuarios

checks:
  dependency_rule:
    enabled: true
    mode: hybrid
    block_for: core_modules

  circular_deps:
    enabled: true
    mode: block

  interface_coverage:
    enabled: true
    mode: hybrid
    block_for: core_modules
    threshold: 100

  domain_isolation:
    enabled: true
    mode: hybrid
    block_for: core_modules

  use_case_size:
    enabled: true
    mode: warn
    max_methods: 8

  module_coverage:
    enabled: true
    mode: warn
    threshold: 60

  # Security Checks (Ação 1 — Harness Preventivo LLC / Step 5d Secure-by-Design)
  # Executados via: python .ace/scripts/fitness-functions.py --check-security --strict
  no_hardcoded_secrets:
    enabled: true
    mode: block

  no_sql_injection:
    enabled: true
    mode: block

  no_asyncstorage_tokens:
    enabled: true
    mode: block

  no_client_only_auth:
    enabled: true
    mode: warn

  user_id_in_tables:
    enabled: true
    mode: block

  # UX Checks (Ação 3 — Harness Preventivo LLC / Step 7a UX Heuristics)
  # Executados via: python .ace/scripts/fitness-functions.py --check-ux --strict
  no_hardcoded_strings:
    enabled: true
    mode: warn

  no_confirmshaming:
    enabled: true
    mode: warn

  no_alert_without_recovery:
    enabled: true
    mode: warn

  no_roach_motel:
    enabled: true
    mode: warn

  form_field_without_label:
    enabled: true
    mode: hybrid
    block_for: core_modules
